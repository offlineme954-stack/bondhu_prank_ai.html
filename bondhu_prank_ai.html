<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বন্ধু, একটা কথা ছিল…</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#020203;color:white}body{overflow:hidden}
.scene{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#350909 0,transparent 25%),radial-gradient(circle at 20% 20%,#250004 0,transparent 28%),linear-gradient(135deg,#030303,#100004 55%,#020203)}
.noise{position:absolute;inset:-50%;opacity:.08;background:repeating-linear-gradient(0deg,#fff0 0 3px,#fff1 4px 5px);animation:n .15s steps(2) infinite}@keyframes n{50%{transform:translate(2%,-1%)}}.v{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,#000 100%)}
.fog{position:absolute;width:55vw;height:18vw;border-radius:50%;background:#780d1430;filter:blur(40px);animation:f 8s ease-in-out infinite}.f1{left:-10vw;top:15vh}.f2{right:-15vw;bottom:10vh;animation-delay:3s}@keyframes f{50%{transform:translate(10vw,4vh) scale(1.2)}}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,620px);padding:42px 25px;text-align:center;border:1px solid #ff2b3d44;border-radius:30px;background:#050507d9;box-shadow:0 0 90px #b4001840,inset 0 0 45px #ff00200b;backdrop-filter:blur(10px)}
.mark{width:76px;height:76px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid #ff334655;background:#160407;box-shadow:0 0 35px #ff001f55;animation:p 2s infinite}.mark span{font-size:31px}@keyframes p{50%{box-shadow:0 0 65px #ff001f88;transform:scale(1.04)}}
h1{font-size:clamp(28px,7vw,54px);margin:25px 0 10px}p{color:#c7bfc3;line-height:1.8}.btn{margin-top:24px;padding:15px 28px;border:1px solid #ff445555;border-radius:16px;background:linear-gradient(135deg,#2b050b,#8e101e);color:white;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 10px 35px #000}.glitch{animation:g .25s steps(2) 4}@keyframes g{25%{transform:translate(-47%,-50%) translate(7px,-2px)}50%{transform:translate(-53%,-50%) translate(-6px,2px)}}
.scare{position:fixed;inset:0;display:none;place-items:center;background:#000;z-index:10}.scare.show{display:grid;animation:x .55s ease}@keyframes x{0%{background:#fff}15%{background:#300008}100%{background:#000}}.face{font-size:min(30vw,190px);filter:drop-shadow(0 0 20px #ff0033);animation:s .7s ease both}@keyframes s{0%{transform:scale(2.8);opacity:0}100%{transform:scale(1);opacity:1}}.final{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#756d72}
</style></head><body>
<div class="scene"><div class="fog f1"></div><div class="fog f2"></div><div class="noise"></div><div class="v"></div>
<main class="card" id="card"><div class="mark"><span>◉</span></div><h1 id="title">বন্ধু, একটা কথা বলার ছিল…</h1><p id="text">একটু মন দিয়ে শুনবি? 😶</p><button class="btn" id="listen" onclick="listen()">শোন…</button></main></div>
<div class="scare" id="scare"><div class="face">👻</div></div><div class="final">Just a harmless prank • No data is collected</div>
<script>
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.88;u.pitch=.72;u.volume=1;speechSynthesis.speak(u)}
function listen(){let c=document.getElementById('card');c.classList.add('glitch');speak('শোন… একটা কথা বলার ছিল। ভয় পাস না, এটা শুধু একটা মজার প্র্যাঙ্ক!');setTimeout(()=>{document.getElementById('title').textContent='আরে বাবা! 😭😂';document.getElementById('text').textContent='ধরা খেয়ে গেছিস! চিন্তা করিস না—এটা শুধু বন্ধুদের সাথে মজা করার জন্য।';document.getElementById('listen').textContent='আবার দেখবি? 👻';document.getElementById('listen').onclick=again;c.classList.remove('glitch')},1800)}
function again(){let s=document.getElementById('scare');s.classList.add('show');speak('হা হা! ভয় পাওয়ার কিছু নেই। এটা শুধু একটা প্র্যাঙ্ক।');setTimeout(()=>s.classList.remove('show'),850)}
</script></body></html>
